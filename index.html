<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Missing Assignments</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: transparent;
    color: #f5f5f5;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 4px 6px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 8px;
    letter-spacing: 0.3px;
    padding-bottom: 8px;
  }
  h1 .count { color: #b8b8b8; font-weight: 500; }
  .empty { color: #8fd19e; font-size: 16px; padding: 4px 0; }
  .err   { color: #f5a5a5; font-size: 14px; padding: 4px 0; }
  ul { list-style: none; }
  li {
    display: flex;
    align-items: center;
    padding: 6px 0;
  }
  li:first-child { padding-top: 2px; }
  li:last-child { border-bottom: none; }
  .badge {
    flex: 0 0 auto;
    min-width: 38px;
    text-align: center;
    padding: 4px 8px;
    margin-right: 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    background: #4a4a4a;
    color: #fff;
  }
  .badge.warn { background: #d97706; }
  .badge.late { background: #dc2626; }
  .info { flex: 1; min-width: 0; overflow: hidden; }
  .assignment {
    font-size: 16px; font-weight: 500; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .class {
    font-size: 12px; color: #b8b8b8; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .who { color: #e5e5e5; font-weight: 600; }
  .stale {
    font-size: 11px; color: #d97706; margin-top: 6px;
    padding-top: 6px; border-top: 1px solid #3a3a3a;
  }
</style>
</head>
<body>
  <h1 id="header">Missing Assignments</h1>
  <div id="root">Loading…</div>

<script>
// Data is written by the ic-assignments-daily task (Claude Code, ~6am) and
// pushed to this repo. Same file also lands in the brain repo for
// family-friday-prep. Schema lives with its consumer on purpose: the last
// version read a Google Sheet by column index and silently showed
// "All caught up" for two days after a column was added upstream.
const DATA_URL = 'assignments.json';
const SHORT = { Cameron: 'Cam', Zachary: 'Zac' };
const STALE_AFTER_DAYS = 2;

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function daysSince(isoDate) {
  const then = Date.parse(isoDate + 'T00:00:00');
  if (isNaN(then)) return null;
  const today = new Date();
  const midnight = Date.parse(
    today.getFullYear() + '-' +
    String(today.getMonth() + 1).padStart(2, '0') + '-' +
    String(today.getDate()).padStart(2, '0') + 'T00:00:00');
  return Math.round((midnight - then) / 86400000);
}

function collect(data) {
  const students = (data && data.students) || {};
  const out = [];
  for (const name of Object.keys(students)) {
    for (const item of (students[name].missing || [])) {
      out.push({
        who: SHORT[name] || name,
        assignment: String(item.assignment || '').trim(),
        // drop the semester suffix: "Physical Science S1" -> "Physical Science"
        class: String(item.class || '').replace(/\s*S\d\s*$/, '').trim(),
        days: Number(item.daysOverdue) || 0
      });
    }
  }
  // most overdue last, matching the old widget's ordering
  return out.sort((a, b) => a.days - b.days);
}

function render(data) {
  const items = collect(data);
  document.getElementById('header').innerHTML =
    'Missing Assignments <span class="count">(' + items.length + ')</span>';

  const root = document.getElementById('root');
  let html;

  if (items.length === 0) {
    html = '<div class="empty">All caught up! &#127881;</div>';
  } else {
    html = '<ul>' + items.map(a => {
      const cls = a.days >= 14 ? 'late' : (a.days >= 5 ? 'warn' : '');
      return '<li><span class="badge ' + cls + '">' + a.days + 'd</span>' +
             '<div class="info">' +
               '<div class="assignment">' + escapeHTML(a.assignment) + '</div>' +
               '<div class="class"><span class="who">' + escapeHTML(a.who) +
                 '</span> &middot; ' + escapeHTML(a.class) + '</div>' +
             '</div></li>';
    }).join('') + '</ul>';
  }

  // Never let a stale feed read as good news.
  const age = data && data.generated ? daysSince(data.generated) : null;
  if (age === null) {
    html += '<div class="stale">No date on feed &mdash; may be stale</div>';
  } else if (age > STALE_AFTER_DAYS) {
    html += '<div class="stale">Last updated ' + age + ' days ago</div>';
  }

  root.innerHTML = html;
}

function load() {
  fetch(DATA_URL + '?_=' + Date.now(), { cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(e => {
      document.getElementById('root').innerHTML =
        '<div class="err">Couldn\'t load assignments: ' + escapeHTML(e.message) + '</div>';
    });
}

load();
setInterval(load, 15 * 60 * 1000);
</script>
</body>
</html>
